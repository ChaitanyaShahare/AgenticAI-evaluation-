[project]
name = "bfsi-agent-eval"
version = "0.1.0"
description = "Reusable trajectory and tool-use evaluation harness for multi-agent BFSI systems (reference: KYC onboarding)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Same packages and bounds as requirements.txt (which explains why each is needed); exact versions live in uv.lock.
dependencies = [
    # system under test
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "anthropic",
    # schema, configuration, contracts
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0",
    # evaluators
    "agentevals",
    "deepeval",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    # secondary adapter
    "opentelemetry-sdk>=1.25",
    "openinference-instrumentation-langchain",
    # runner and reports
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "jinja2>=3.1",
    # synthetic data and tester tooling
    "faker>=30",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["ruff", "pre-commit", "yamllint"]

[project.scripts]
evalkit = "evalkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # projects/ is imported as a namespace package from the repository root
markers = [
    "api: needs ANTHROPIC_API_KEY and makes live model calls (skipped by default in smoke)",
    "slow: takes more than a few seconds",
]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["projects/kyc_onboarding/data"]   # v0.12 generator keeps its own style

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# PII / PCI recognisers used by BF-1 (evalkit/evaluators/bfsi/pii.py).
# Detection only: which entity may not appear where is the masking policy (projects/<name>/policies/pii_masking.yaml).
# A checksum drops look-alikes: a 12-digit reference that fails Verhoeff is not reported as an Aadhaar number.
# Masked forms (******877U, XXXX XXXX 4655, card ending 1111) do not match and therefore pass.
# Recall and precision are measured on tests/fixtures/pii_labelled.jsonl (target recall ≥ 95%).

version: 1

recognizers:
  - entity: IN_PAN
    description: Indian Permanent Account Number — 5 letters, 4 digits, 1 letter
    pattern: '(?<![A-Za-z0-9])[A-Z]{5}[0-9]{4}[A-Z](?![A-Za-z0-9])'
  - entity: IN_AADHAAR
    description: Aadhaar — 12 digits, first digit 2–9, optional spaces or hyphens in groups of 4, Verhoeff check digit
    pattern: '(?<![0-9])(?<![0-9] )(?<![0-9]-)[2-9][0-9]{3}[ -]?[0-9]{4}[ -]?[0-9]{4}(?![ -]?[0-9])'   # not part of a longer digit group (card)
    checksum: verhoeff
  - entity: CARD_PAN
    description: Payment card number — 13 to 19 digits, optional spaces or hyphens, Luhn check
    pattern: '(?<![0-9])[0-9](?:[ -]?[0-9]){12,18}(?![0-9])'
    checksum: luhn
  - entity: IN_PHONE
    description: Indian mobile number — 10 digits starting 6–9, optional +91 / 0 prefix
    pattern: '(?<![0-9])(?:\+91[ -]?|0)?[6-9][0-9]{4}[ -]?[0-9]{5}(?![0-9])'
  - entity: EMAIL
    description: E-mail address
    pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
